name: Deploy — Produção

on:
  workflow_run:
    workflows: ["CI — Testes e Build"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # nunca cancelar deploy em andamento

jobs:
  deploy:
    name: 🚀 Deploy ${{ github.event.inputs.environment || 'production' }}
    # Self-hosted: o "servidor de produção" é a própria máquina do Lucas
    # (Windows, iniciada via scripts\infra\*.bat + Cloudflare Tunnel — sem
    # VPS separado). O runner GHA roda nela e puxa jobs por conexão de saída
    # (sem abrir porta nenhuma). Ver scripts/infra/run_gha_runner.bat.
    runs-on: [self-hosted, windows, astrum-home]
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    # NOTA: `environment.url` NÃO aceita o contexto `secrets` (só env/vars/github…).
    # Usar `${{ secrets.PRODUCTION_URL }}` aqui invalidava o workflow inteiro
    # (startup failure em todo push, workflow_run nunca disparava). Removido — o
    # health-check pós-deploy já usa a URL via `run:` (onde secrets é permitido).
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    # O contexto `secrets` NÃO é permitido em `if:` de step (causa startup failure).
    # Mapeamos a presença de cada secret aqui (env de job pode usar secrets) e os
    # steps checam via `env.HAS_*`.
    env:
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
      HAS_PRODUCTION_URL: ${{ secrets.PRODUCTION_URL != '' }}
      # Commit exato que passou no CI (evento workflow_run) — o servidor faz checkout dele.
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      # Caminho fixo do checkout "vivo" nesta máquina (o mesmo que start_astrum.bat usa).
      DEPLOY_PATH: E:\Saas\AstrumISP

    steps:
      # Checkout no workspace do runner (_work\...) — só para o Sentry
      # `set-commits --auto` ler o histórico git. NÃO é o diretório servido;
      # esse é o DEPLOY_PATH abaixo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deploy local: atualiza o checkout "vivo" em E:\Saas\AstrumISP pro commit
      # que passou no CI e reinicia só o backend Fastify (Docker/Redis/Qdrant e
      # o tunnel Cloudflare continuam rodando sem interrupção).
      # IMPORTANTE: fica em "git checkout main" (nunca detached HEAD) — esse
      # mesmo diretório é o working dir de desenvolvimento; um "git checkout
      # <SHA>" solto quebra qualquer commit feito ali depois (cai fora da main).
      - name: Atualizar código (git checkout local)
        shell: cmd
        run: |
          cd /d "%DEPLOY_PATH%"
          git fetch --all --prune
          git checkout main
          git reset --hard %DEPLOY_SHA%

      - name: Instalar dependências (workspaces)
        shell: cmd
        run: |
          cd /d "%DEPLOY_PATH%"
          npm install

      - name: Reiniciar backend (Fastify)
        shell: cmd
        run: call "%DEPLOY_PATH%\scripts\infra\deploy_restart_backend.bat"

      # DESATIVADO: o frontend é publicado pela integração Git do próprio Vercel,
      # não por este pipeline. Este passo apontava para apps/web/dist (removido no S78).
      - name: Deploy Frontend (Vercel)
        if: false
        run: |
          npm install -g vercel
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }} dist
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Notificar Sentry de novo release
        if: ${{ env.HAS_SENTRY == 'true' }}
        run: |
          npm install -g @sentry/cli
          sentry-cli releases new "${{ github.sha }}"
          sentry-cli releases set-commits "${{ github.sha }}" --auto
          sentry-cli releases finalize "${{ github.sha }}"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: astrum-isp
          SENTRY_PROJECT: astrum-api

      - name: Health check pós-deploy
        if: ${{ env.HAS_PRODUCTION_URL == 'true' }}
        shell: cmd
        run: |
          timeout /t 10 /nobreak >nul
          curl -f "${{ secrets.PRODUCTION_URL }}/api/v2/health" || exit /b 1
          echo Health check passou

      - name: Notificar sucesso
        if: success()
        run: |
          echo "🚀 Deploy de produção concluído!"
          echo "Commit: ${{ github.sha }}"
          echo "URL: ${{ secrets.PRODUCTION_URL }}"
