name: Deploy — Produção

on:
  workflow_run:
    workflows: ["CI — Testes e Build"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # nunca cancelar deploy em andamento

jobs:
  deploy:
    name: 🚀 Deploy ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    # NOTA: `environment.url` NÃO aceita o contexto `secrets` (só env/vars/github…).
    # Usar `${{ secrets.PRODUCTION_URL }}` aqui invalidava o workflow inteiro
    # (startup failure em todo push, workflow_run nunca disparava). Removido — o
    # health-check pós-deploy já usa a URL via `run:` (onde secrets é permitido).
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    # O contexto `secrets` NÃO é permitido em `if:` de step (causa startup failure).
    # Mapeamos a presença de cada secret aqui (env de job pode usar secrets) e os
    # steps checam via `env.HAS_*`.
    env:
      HAS_DEPLOY_SSH: ${{ secrets.DEPLOY_SSH_HOST != '' }}
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
      HAS_PRODUCTION_URL: ${{ secrets.PRODUCTION_URL != '' }}
      # Commit exato que passou no CI (evento workflow_run) — o servidor faz checkout dele.
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      # Histórico completo p/ o Sentry `set-commits --auto` (quando habilitado).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deploy self-hosted: SSH no servidor Docker → rebuilda o astrum-api a partir
      # do commit que passou no CI (git checkout + docker compose build + up -d).
      # Requer o repo clonado em DEPLOY_PATH no servidor, com acesso de leitura ao
      # GitHub (o build acontece no próprio servidor). Enquanto DEPLOY_SSH_HOST não
      # estiver setado, o passo é pulado (não derruba o deploy).
      - name: Deploy backend (SSH → docker compose)
        if: ${{ env.HAS_DEPLOY_SSH == 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --prune
            git checkout ${{ env.DEPLOY_SHA }}
            docker compose build astrum-api
            docker compose up -d astrum-api
            docker image prune -f

      # DESATIVADO: o frontend é publicado pela integração Git do próprio Vercel,
      # não por este pipeline. Este passo apontava para apps/web/dist (removido no S78).
      - name: Deploy Frontend (Vercel)
        if: false
        run: |
          npm install -g vercel
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }} dist
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Notificar Sentry de novo release
        if: ${{ env.HAS_SENTRY == 'true' }}
        run: |
          npm install -g @sentry/cli
          sentry-cli releases new "${{ github.sha }}"
          sentry-cli releases set-commits "${{ github.sha }}" --auto
          sentry-cli releases finalize "${{ github.sha }}"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: astrum-isp
          SENTRY_PROJECT: astrum-api

      - name: Health check pós-deploy
        if: ${{ env.HAS_PRODUCTION_URL == 'true' }}
        run: |
          sleep 10
          curl -f ${{ secrets.PRODUCTION_URL }}/api/v2/health || exit 1
          echo "✅ Health check passou"

      - name: Notificar sucesso
        if: success()
        run: |
          echo "🚀 Deploy de produção concluído!"
          echo "Commit: ${{ github.sha }}"
          echo "URL: ${{ secrets.PRODUCTION_URL }}"
