# Usar com: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Em dev o Redis fica acessível localmente (127.0.0.1:6379)
# para permitir redis-cli, Bull Board, etc.
# A senha ainda é obrigatória — nunca tire o requirepass.

version: '3.8'

services:

  # Em dev: Redis exposto localmente para debug
  redis:
    ports:
      - "127.0.0.1:6379:6379"   # só localhost — não expõe para rede do host
    networks:
      - internal_dev

  # Em dev: Qdrant exposto localmente para debug
  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - internal_dev

  # Em dev: Zep com acesso ao Supabase cloud
  # Requer: ZEP_POSTGRES_DSN no .env (ver infra/sql/create-zep-user.sql)
  zep:
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal_dev

  # Em dev: API com hot-reload
  api:
    build:
      target: deps
    command: npm run dev --workspace=apps/api
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    environment:
      NODE_ENV: development
      # Em dev também usa senha — evita divergência de comportamento
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - internal_dev
      - external_dev

  # Em dev: Web com Vite HMR
  web:
    build:
      target: builder
    command: npm run dev --workspace=apps/web
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
    environment:
      VITE_API_URL: http://localhost:3001
    networks:
      - external_dev

  # ─── Evolution API ────────────────────────────────────────
  # WhatsApp Business — API de mensagens
  # Porta: 8080 | Dashboard: http://localhost:8080
  # API Key gerada automaticamente no primeiro start, ou via EVOLUTION_LOCAL_API_KEY
  evolution-api:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: astrum-evolution
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_data:/evolution/store
      - evolution_instances:/evolution/instances
    environment:
      # URL pública usada para webhooks — em dev usa o tunnel (atualizar após start)
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      # Chave de autenticação da API — configure no .env como EVOLUTION_LOCAL_API_KEY
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_LOCAL_API_KEY:-astrum-evolution-dev-key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      # Banco local SQLite — não precisa de Postgres externo em dev
      DATABASE_PROVIDER: sqlite
      DATABASE_CONNECTION_URI: file:./evolution.db
      # Cache em memória em dev (sem Redis externo para Evolution)
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Logs
      LOG_LEVEL: ERROR
      LOG_COLOR: "true"
      # Webhook global (opcional — Evolution manda eventos para cá)
      WEBHOOK_GLOBAL_URL: ""
      WEBHOOK_GLOBAL_ENABLED: "false"
    networks:
      - external_dev

networks:
  internal_dev:
    driver: bridge
    # sem 'internal: true' em dev — containers precisam de internet para npm, etc.
  external_dev:
    driver: bridge

volumes:
  evolution_data:
  evolution_instances:
