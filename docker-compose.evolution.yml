# ═══════════════════════════════════════════════════════════════════════════
# Evolution API v2 — WhatsApp para TESTE LOCAL (F2-04 / atendimento IA).
#
# Stack isolado (postgres + redis próprios) — NÃO depende do docker-compose.yml
# de produção. Sobe só o que o Evolution precisa, expondo a API em localhost:8080.
#
# COMO USAR (depois de abrir o Docker Desktop):
#   docker compose -f docker-compose.evolution.yml up -d
#   # aguarde ~20s e cheque:  curl http://localhost:8080  (deve responder JSON)
#
# Depois, no .env do backend Astrum (apps/api), aponte:
#   EVOLUTION_API_URL=http://localhost:8080
#   EVOLUTION_API_KEY=troque-esta-chave-astrum-evolution
#
# Para parar:   docker compose -f docker-compose.evolution.yml down
# Apagar dados: docker compose -f docker-compose.evolution.yml down -v
# ═══════════════════════════════════════════════════════════════════════════
name: astrum-evolution-test

services:
  evolution:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: evolution-api
    ports:
      - "8080:8080"
    environment:
      # ── Auth ──────────────────────────────────────────────
      # TROQUE por um segredo seu antes de usar de verdade.
      AUTHENTICATION_API_KEY: troque-esta-chave-astrum-evolution
      # ── Server ────────────────────────────────────────────
      SERVER_URL: http://localhost:8080
      # ── Banco (Postgres) — persiste instâncias/sessões ────
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: astrum_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # ── Cache (Redis) ─────────────────────────────────────
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      # ── Baileys (WhatsApp Web) ────────────────────────────
      CONFIG_SESSION_PHONE_CLIENT: Astrum
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      LOG_LEVEL: ERROR
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    restart: unless-stopped

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    volumes:
      - evolution_redis:/data
    restart: unless-stopped

volumes:
  evolution_pg:
  evolution_redis:
